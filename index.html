<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PremiumHost Roberto – Administradora de Temporada em Salvador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      color: #fff;
      background: #1a1a1a;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: 0.02em; }

    .landing {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
    }
    .landing-bg {
      position: fixed;
      inset: 0;
      background-image: url('https://donaviagem.com/wp-content/uploads/2023/06/Farol-da-Barra-Salvador-Bahia-Dona-Viagem.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      z-index: -2;
    }
    .landing-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 26, 0.75);
      z-index: -1;
    }

    .landing-logo {
      width: 120px;
      height: auto;
      margin-bottom: 12px;
    }
    .landing-title {
      font-size: 2rem;
      color: #c8a96a;
      margin-bottom: 8px;
      text-align: center;
    }
    .landing-sub {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-bottom: 48px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 420px;
    }

    .btn-landing {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      padding: 28px 24px;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      font-family: 'Cormorant Garamond', serif;
      text-decoration: none;
      gap: 16px;
    }
    .btn-landing:hover {
      transform: translateY(-2px);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .btn-logo {
      width: 40px;
      height: auto;
      flex-shrink: 0;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .btn-chat {
      background: linear-gradient(135deg, #075e54, #128c7e);
      color: #fff;
      box-shadow: 0 4px 20px rgba(18,140,126,0.3);
    }
    .btn-chat:hover {
      box-shadow: 0 6px 28px rgba(18,140,126,0.45);
    }
    .btn-chat .btn-main {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .btn-chat .btn-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 300;
      opacity: 0.85;
      margin-top: 4px;
    }

    .btn-site {
      background: transparent;
      color: #c8a96a;
      border: 2px solid rgba(200,169,106,0.4);
    }
    .btn-site:hover {
      border-color: #c8a96a;
      background: rgba(200,169,106,0.06);
    }
    .btn-site .btn-main {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .btn-site .btn-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;
      opacity: 0.6;
      margin-top: 4px;
    }

    .btn-whatsapp-float {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #25D366;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(37,211,102,0.3);
      cursor: pointer;
      transition: all 0.3s;
      z-index: 100;
      border: none;
    }
    .btn-whatsapp-float:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 24px rgba(37,211,102,0.4);
    }
    .btn-whatsapp-float svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }

    .landing-footer {
      padding: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
    }

    /* ===== CHAT MODAL FULLSCREEN ===== */
    :root {
      --wa-green: #075e54;
      --wa-teal: #128c7e;
      --wa-bg: #efeae2;
      --wa-msg-user: #d9fdd3;
      --wa-msg-bot: #fff;
      --wa-header-text: #fff;
      --wa-text: #111b21;
      --wa-text-secondary: #667781;
    }

    .chat-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--wa-bg);
      z-index: 99999;
      flex-direction: column;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      animation: fadeIn 0.3s ease;
    }

    .chat-modal.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .chat-modal-header {
      background: var(--wa-green);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .chat-modal-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-modal-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-modal-avatar svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .chat-modal-title {
      color: var(--wa-header-text);
      font-size: 1rem;
      font-weight: 600;
    }

    .chat-modal-sub {
      color: rgba(255,255,255,0.75);
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .chat-modal-close {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-size: 1.5rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .chat-modal-close:hover {
      color: #fff;
    }

    .chat-modal-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
      background-image: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="wa" patternUnits="userSpaceOnUse" width="4" height="4"><circle cx="2" cy="2" r="1.2" fill="rgba(0,0,0,0.03)"/></pattern></defs><rect width="100%" height="100%" fill="url(%23wa)"/></svg>');
    }

    .chat-modal-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-modal-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-modal-messages::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.15);
      border-radius: 3px;
    }

    .chat-msg {
      display: flex;
      flex-direction: column;
      max-width: 70%;
      animation: msgIn 0.2s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-msg.bot {
      align-self: flex-start;
    }

    .chat-msg.user {
      align-self: flex-end;
    }

    .msg-content {
      padding: 10px 14px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .chat-msg.bot .msg-content {
      background: var(--wa-msg-bot);
      color: var(--wa-text);
      border-radius: 10px 10px 10px 2px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    }

    .chat-msg.user .msg-content {
      background: var(--wa-msg-user);
      color: var(--wa-text);
      border-radius: 10px 10px 2px 10px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    }

    .msg-time {
      font-size: 0.7rem;
      color: var(--wa-text-secondary);
      margin-top: 2px;
      padding: 0 6px;
    }

    .chat-msg.user .msg-time {
      text-align: right;
    }

    .chat-typing {
      display: none;
      align-self: flex-start;
      padding: 12px 14px;
      background: var(--wa-msg-bot);
      border-radius: 10px 10px 10px 2px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    }

    .chat-typing.active {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .chat-typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8796a1;
      animation: typing 1.4s infinite;
    }

    .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
    .chat-typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .chat-modal-input-area {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #f0f2f5;
      border-top: 1px solid rgba(0,0,0,0.08);
    }

    .chat-modal-input {
      flex: 1;
      border: none;
      border-radius: 24px;
      padding: 11px 16px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      background: #fff;
      color: var(--wa-text);
    }

    .chat-modal-input::placeholder {
      color: var(--wa-text-secondary);
    }

    .chat-modal-send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--wa-teal);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .chat-modal-send:hover {
      background: #0b9a89;
    }

    .chat-modal-send svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .chat-modal-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 480px) {
      .chat-msg {
        max-width: 85%;
      }
    }

    @media (max-width: 480px) {
      .landing-logo { width: 90px; }
      .landing-title { font-size: 1.5rem; }
      .btn-chat .btn-main { font-size: 1.2rem; }
      .btn-site .btn-main { font-size: 1.1rem; }
      .btn-landing { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="landing-bg"></div>

  <main class="landing">
    <img src="/logo-white.png" alt="PremiumHost Roberto" class="landing-logo">
    <h1 class="landing-title">PremiumHost Roberto</h1>
    <p class="landing-sub">Apartamentos de temporada em Salvador</p>

    <div class="btn-group">
      <button class="btn-landing btn-chat" onclick="openChat()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>

      <a href="/" class="btn-landing btn-site">
        <img src="/logo-white.png" alt="PremiumHost" class="btn-logo">
        <div class="btn-text">

        </div>
      </a>
    </div>
  </main>

  <footer class="landing-footer">
    &copy; 2026 PremiumHost Roberto &mdash; Todos os direitos reservados
  </footer>

  <!-- Chat Modal Fullscreen -->
  <div class="chat-modal" id="chatModal">
    <div class="chat-modal-header">
      <div class="chat-modal-header-info">
        <div class="chat-modal-avatar">
          <svg viewBox="0 0 24 24">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>

          <div class="chat-modal-title">PremiumHost Roberto</div>

      </div>
      <button class="chat-modal-close" onclick="closeChat()">✕</button>
    </div>
    <div class="chat-modal-messages" id="chatMessages"></div>
    <div class="chat-modal-input-area">
      <input type="text" class="chat-modal-input" id="chatInput" placeholder="Digite uma mensagem" autocomplete="off">
      <button class="chat-modal-send" id="chatSend" aria-label="Enviar">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <a href="https://wa.me/5571992900979" target="_blank" class="btn-whatsapp-float" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script>
    const API_URL = '';
    let guestId = 'web_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    const chatModal = document.getElementById('chatModal');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSend');

    // Rastrear cliques nos botões da landing page
    function trackClick(button) {
      fetch(API_URL + '/api/landing-click', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          button: button,
          guest_id: guestId,
          timestamp: new Date().toISOString()
        })
      }).catch(() => {});
    }

    function openChat() {
      trackClick('btn_chat');
      chatModal.classList.add('active');
      chatMessages.innerHTML = '<div class="chat-msg bot"><div class="msg-content">Oi, tudo bem? Sou Roberto, como posso te ajudar? :)</div><div class="msg-time">agora</div></div>';
      setTimeout(() => chatInput.focus(), 300);
      scrollToBottom();
    }

    // Rastrear clique no botão de site
    document.addEventListener('DOMContentLoaded', () => {
      const btnSite = document.querySelector('.btn-site');
      if (btnSite) {
        btnSite.addEventListener('click', () => {
          trackClick('btn_site');
        });
      }
    });

    function closeChat() {
      chatModal.classList.remove('active');
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'chat-msg ' + type;
      const content = document.createElement('div');
      content.className = 'msg-content';
      content.innerHTML = text.replace(/\n/g, '<br>');
      div.appendChild(content);
      const time = document.createElement('div');
      time.className = 'msg-time';
      const now = new Date();
      time.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
      div.appendChild(time);
      chatMessages.appendChild(div);
      scrollToBottom();
    }

    function showTyping() {
      let typing = document.querySelector('.chat-typing');
      if (!typing) {
        typing = document.createElement('div');
        typing.className = 'chat-typing';
        typing.innerHTML = '<span></span><span></span><span></span>';
        chatMessages.appendChild(typing);
      }
      typing.classList.add('active');
      scrollToBottom();
    }

    function hideTyping() {
      const typing = document.querySelector('.chat-typing');
      if (typing) typing.classList.remove('active');
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = '';
      chatSend.disabled = true;
      addMessage(text, 'user');
      showTyping();

      try {
        const res = await fetch(API_URL + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            guest_id: guestId,
            platform: 'web'
          })
        });

        if (!res.ok) throw new Error('Erro ' + res.status);
        const data = await res.json();
        hideTyping();
        addMessage(data.response, 'bot');
      } catch (err) {
        hideTyping();
        addMessage('Desculpe, não consegui me conectar ao servidor. Tente novamente ou entre em contato pelo WhatsApp.', 'bot');
      } finally {
        chatSend.disabled = false;
        chatInput.focus();
      }
    }

    chatSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Fechar chat ao pressionar ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && chatModal.classList.contains('active')) {
        closeChat();
      }
    });
  </script>
</body>
</html>
