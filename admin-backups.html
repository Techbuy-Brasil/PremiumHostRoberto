<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backups – PremiumHost Roberto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Inter, sans-serif; background: #f5f3f0; margin: 0; }
    .topo { background: #1a1a2e; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .topo h1 { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; margin: 0; color: #c8a96a; }
    .topo a { color: #c8a96a; text-decoration: none; font-size: .82rem; }
    .topo a:hover { text-decoration: underline; }
    .container { max-width: 800px; margin: 0 auto; padding: 24px 16px 60px; }
    .login-box { max-width: 360px; margin: 80px auto; text-align: center; }
    .login-box h2 { font-family: 'Cormorant Garamond', serif; color: #1a1a2e; }
    .login-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; margin-bottom: 12px; }
    .login-box button { width: 100%; }
    .erro { color: #e74c3c; font-size: .85rem; display: none; margin-top: 8px; }
    .card { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.07); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .card .info { flex: 1; min-width: 200px; }
    .card .label { font-weight: 600; font-size: .9rem; color: #1a1a2e; }
    .card .date { font-size: .78rem; color: #888; margin-top: 2px; }
    .card .actions { display: flex; gap: 6px; }
    .acoes { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn { padding: 10px 24px; border: none; border-radius: 6px; font-size: .85rem; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #1a1a2e; color: #fff; }
    .btn-primary:hover { background: #2a2a4e; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-secondary { background: #e8e0d4; color: #1a1a2e; }
    .btn-warning { background: #f39c12; color: #fff; }
    .vazio { text-align: center; color: #999; font-size: .85rem; padding: 40px 0; }
    .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: .85rem; display: none; z-index: 1000; color: #fff; }
    .toast.success { background: #27ae60; }
    .toast.error { background: #e74c3c; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 999; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 28px; max-width: 420px; width: 90%; text-align: center; }
    .modal h3 { margin-top: 0; }
    .modal p { font-size: .85rem; color: #666; margin-bottom: 20px; }
    .modal .btn { margin: 0 4px; }
    @media (max-width: 600px) { .topo { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>

  <div id="app">

    <div class="topo" id="topo" style="display:none">
      <div>
        <h1>&#128230; Backups automáticos</h1>
        <span style="font-size:.72rem;opacity:.6">Snapshots criados automaticamente antes de cada salvamento</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a href="admin.html">Datas</a>
        <a href="admin-precos.html">Preços</a>
        <a href="admin-faq.html">FAQ</a>
        <a href="admin-photos.html">Fotos</a>
        <a href="painel.html">Painel</a>
        <a href="#" onclick="sair()" style="color:#fff">Sair</a>
      </div>
    </div>

    <div class="login-box" id="loginBox">
      <h2>&#128230; Backups</h2>
      <p style="color:#888;font-size:.85rem;margin-bottom:20px">Senha de admin para gerenciar backups</p>
      <input type="password" id="senhaInput" placeholder="Senha" onkeydown="if(event.key==='Enter')entrar()">
      <button class="btn btn-primary" onclick="entrar()">Entrar</button>
      <p class="erro" id="loginErro"></p>
    </div>

    <div class="container" id="conteudo" style="display:none">

      <div class="acoes">
        <button class="btn btn-success" onclick="criarBackup()">+ Criar backup agora</button>
        <button class="btn btn-secondary" onclick="carregar()">&#8635; Recarregar</button>
      </div>

      <div id="lista" style="margin-top:8px"></div>

    </div>

    <div class="toast" id="toast"></div>

    <!-- Modal confirmar restauracao -->
    <div class="modal-overlay" id="modalRestore">
      <div class="modal">
        <h3>&#9888; Restaurar backup?</h3>
        <p id="modalMsg">Isso vai sobrescrever todos os dados atuais no Supabase com os dados deste backup. Tem certeza?</p>
        <div>
          <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
          <button class="btn btn-warning" onclick="confirmarRestore()">Sim, restaurar</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const API = 'https://premiumhost-roberto.vercel.app';
    let password = '';
    let backupParaRestaurar = '';

    function toast(msg, ok) {
      const t = document.getElementById('toast');
      t.className = 'toast ' + (ok ? 'success' : 'error');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 4000);
    }

    function entrar() {
      const pwd = document.getElementById('senhaInput').value;
      if (!pwd) return;
      password = pwd;
      fetch(API + '/api/admin/backups?password=' + encodeURIComponent(password) + '&_=' + Date.now())
        .then(r => { if (!r.ok) throw new Error('Senha incorreta'); return r.json(); })
        .then(() => {
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('conteudo').style.display = 'block';
          document.getElementById('topo').style.display = 'flex';
          carregar();
        })
        .catch(e => {
          document.getElementById('loginErro').textContent = e.message;
          document.getElementById('loginErro').style.display = 'block';
          password = '';
        });
    }

    function sair() {
      password = '';
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('conteudo').style.display = 'none';
      document.getElementById('topo').style.display = 'none';
      document.getElementById('senhaInput').value = '';
    }

    function esc(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function formatDate(ts) {
      if (!ts) return '';
      var parts = ts.split('_');
      if (parts.length < 2) return ts;
      var d = parts[0], t = parts[1];
      return d.substring(0,4) + '/' + d.substring(4,6) + '/' + d.substring(6,8) + ' ' + t.substring(0,2) + ':' + t.substring(2,4) + ':' + t.substring(4,6);
    }

    function labelDisplay(lbl) {
      var map = {
        'faq_automatico': 'FAQ (automático)',
        'precos_automatico': 'Preços (automático)',
        'calendario_automatico': 'Calendário (automático)',
        'fotos_automatico': 'Fotos (automático)',
        'manual': 'Manual',
      };
      return map[lbl] || lbl;
    }

    function carregar() {
      fetch(API + '/api/admin/backups?password=' + encodeURIComponent(password) + '&_=' + Date.now())
        .then(r => r.json())
        .then(lista => {
          var el = document.getElementById('lista');
          if (!lista.length) {
            el.innerHTML = '<div class="vazio">Nenhum backup encontrado. Os backups são criados automaticamente ao salvar dados.</div>';
            return;
          }
          var html = '<div style="font-size:.78rem;color:#888;margin-bottom:12px">' + lista.length + ' backup(s) — backups com mais de 90 dias são removidos automaticamente.</div>';
          lista.forEach(function(b) {
            var lbl = labelDisplay(b.label);
            html += '<div class="card">';
            html += '  <div class="info">';
            html += '    <div class="label">' + esc(lbl) + '</div>';
            html += '    <div class="date">' + formatDate(b.created_at) + '</div>';
            html += '  </div>';
            html += '  <div class="actions">';
            html += '    <button class="btn btn-warning" style="padding:6px 14px;font-size:.78rem" onclick="restaurar(\'' + esc(b.key) + '\')">Restaurar</button>';
            html += '    <button class="btn btn-danger" style="padding:6px 14px;font-size:.78rem" onclick="deletar(\'' + esc(b.key) + '\')">Excluir</button>';
            html += '  </div>';
            html += '</div>';
          });
          el.innerHTML = html;
        })
        .catch(e => toast('Erro: ' + e.message, false));
    }

    function criarBackup() {
      fetch(API + '/api/admin/backups/create?password=' + encodeURIComponent(password) + '&label=manual&_=' + Date.now(), { method: 'POST' })
        .then(r => { if (!r.ok) throw new Error('Erro'); return r.json(); })
        .then(function() {
          toast('Backup criado com sucesso!', true);
          carregar();
        })
        .catch(e => toast('Erro: ' + e.message, false));
    }

    function restaurar(key) {
      backupParaRestaurar = key;
      document.getElementById('modalMsg').textContent = 'Restaurar "' + key + '"? Isso vai sobrescrever TODOS os dados do Supabase (FAQ, preços, calendário, fotos) com os dados deste backup.';
      document.getElementById('modalRestore').classList.add('active');
    }

    function fecharModal() {
      backupParaRestaurar = '';
      document.getElementById('modalRestore').classList.remove('active');
    }

    function confirmarRestore() {
      if (!backupParaRestaurar) return;
      fecharModal();
      toast('Restaurando...', true);
      fetch(API + '/api/admin/backups/restore/' + encodeURIComponent(backupParaRestaurar) + '?password=' + encodeURIComponent(password), {
        method: 'POST',
      })
        .then(r => { if (!r.ok) return r.json().then(e => { throw new Error(e.detail); }); return r.json(); })
        .then(function(r) {
          toast('Backup "' + r.label + '" restaurado com sucesso!', true);
          carregar();
        })
        .catch(e => toast('Erro: ' + e.message, false));
    }

    function deletar(key) {
      if (!confirm('Excluir backup "' + key + '"?')) return;
      fetch(API + '/api/admin/backups/delete/' + encodeURIComponent(key) + '?password=' + encodeURIComponent(password), { method: 'POST' })
        .then(r => { if (!r.ok) throw new Error('Erro'); return r.json(); })
        .then(function() {
          toast('Backup excluído', true);
          carregar();
        })
        .catch(e => toast('Erro: ' + e.message, false));
    }
  </script>

</body>
</html>
