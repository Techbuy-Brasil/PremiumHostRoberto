<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PremiumHost Roberto – Administradora de Temporada em Salvador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      color: #fff;
      background: #1a1a1a;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: 0.02em; }

    .landing {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
    }
    .landing-bg {
      position: fixed;
      inset: 0;
      background-image: url('https://donaviagem.com/wp-content/uploads/2023/06/Farol-da-Barra-Salvador-Bahia-Dona-Viagem.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      z-index: -2;
    }
    .landing-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 26, 0.75);
      z-index: -1;
    }

    .landing-logo {
      width: 120px;
      height: auto;
      margin-bottom: 12px;
    }
    .landing-title {
      font-size: 2rem;
      color: #c8a96a;
      margin-bottom: 8px;
      text-align: center;
    }
    .landing-sub {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-bottom: 48px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 420px;
    }

    .btn-landing {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      padding: 28px 24px;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      font-family: 'Cormorant Garamond', serif;
      text-decoration: none;
      gap: 16px;
    }
    .btn-landing:hover {
      transform: translateY(-2px);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .btn-logo {
      width: 40px;
      height: auto;
      flex-shrink: 0;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .btn-chat {
      background: linear-gradient(135deg, #075e54, #128c7e);
      color: #fff;
      box-shadow: 0 4px 20px rgba(18,140,126,0.3);
    }
    .btn-chat:hover {
      box-shadow: 0 6px 28px rgba(18,140,126,0.45);
    }
    .btn-chat .btn-main {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .btn-chat .btn-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 300;
      opacity: 0.85;
      margin-top: 4px;
    }

    .btn-site {
      background: transparent;
      color: #c8a96a;
      border: 2px solid rgba(200,169,106,0.4);
    }
    .btn-site:hover {
      border-color: #c8a96a;
      background: rgba(200,169,106,0.06);
    }
    .btn-site .btn-main {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .btn-site .btn-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;
      opacity: 0.6;
      margin-top: 4px;
    }

    .btn-whatsapp-float {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #25D366;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(37,211,102,0.3);
      cursor: pointer;
      transition: all 0.3s;
      z-index: 100;
      border: none;
    }
    .btn-whatsapp-float:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 24px rgba(37,211,102,0.4);
    }
    .btn-whatsapp-float svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }

    .landing-footer {
      padding: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
    }

    @media (max-width: 480px) {
      .landing-logo { width: 90px; }
      .landing-title { font-size: 1.5rem; }
      .btn-chat .btn-main { font-size: 1.2rem; }
      .btn-site .btn-main { font-size: 1.1rem; }
      .btn-landing { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="landing-bg"></div>

  <main class="landing">
    <img src="/logo-white.png" alt="PremiumHost Roberto" class="landing-logo">
    <h1 class="landing-title">PremiumHost Roberto</h1>
    <p class="landing-sub">Apartamentos de temporada em Salvador</p>

    <div class="btn-group">
      <button onclick="window.location.href='/'" class="btn-landing btn-chat">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        <div class="btn-text">
          <span class="btn-main">Consulte Preço Agora</span>
          <span class="btn-sub">Fale direto pelo WhatsApp</span>
        </div>
      </button>

      <a href="/" class="btn-landing btn-site">
        <img src="/logo-white.png" alt="PremiumHost" class="btn-logo">
        <div class="btn-text">
          <span class="btn-main">Ver Fotos e Tirar Dúvidas</span>
          <span class="btn-sub">Veja todos detalhes</span>
        </div>
      </a>
    </div>
  </main>

  <footer class="landing-footer">
    &copy; 2026 PremiumHost Roberto &mdash; Todos os direitos reservados
  </footer>

  <a href="https://wa.me/5571992900979" target="_blank" class="btn-whatsapp-float" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script>
    // Botão de chat vai para a página principal com parâmetro ?openChat=1
    document.querySelector('.btn-chat').addEventListener('click', function() {
      window.location.href = '/?openChat=1';
    });
  </script>
</body>
</html>
